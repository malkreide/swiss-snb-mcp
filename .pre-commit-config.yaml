# Pre-Commit-Hooks — spiegeln den `lint`-Job aus .github/workflows/ci.yml.
#
# Zweck: Was hier durchläuft, läuft auch in der CI durch. Anlass war ein
# fehlgeschlagener `ruff format --check src/`, der lokal nicht auffiel, weil
# pyproject.toml für die Entwicklung nur `ruff>=0.5` verlangt, die CI aber eine
# exakte Version pinnt — zwei Ruff-Versionen, zwei Formatierungen.
#
# pre-commit installiert Ruff in einer eigenen, isolierten Umgebung. Die hier
# gepinnte `rev` entscheidet, nicht das lokal installierte Ruff; damit ist die
# Versions-Drift, die den Fehler verursacht hat, konstruktionsbedingt weg.
#
# ACHTUNG: `rev` unten und `pip install ruff==…` im lint-Job von ci.yml müssen
# dieselbe Version nennen. Beim Anheben beide Stellen ändern.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      # `files: ^src/` bildet den CI-Job exakt ab: der prüft ausschliesslich
      # `src/`. `tests/` und `scripts/` sind heute nicht ruff-sauber; sie hier
      # einzubeziehen würde Commits an unberührtem Alt-Code blockieren, den die
      # CI durchwinkt — der Hook wäre strenger als das, was tatsächlich gilt.
      - id: ruff-check
        files: ^src/
      - id: ruff-format
        files: ^src/

  - repo: local
    hooks:
      # Dritter Schritt des lint-Jobs. Prüft pyproject.toml gegen server.json
      # und die README-Badges, und dass in `src/` keine Version von Hand steht.
      # Reine Standardbibliothek, deshalb `language: system` ohne eigene Env.
      #
      # `always_run`, weil die Abweichung aus jeder der beteiligten Dateien
      # entstehen kann und der Check billig ist.
      - id: version-sync
        name: Versions-Sync (pyproject ↔ server.json / README / src)
        entry: python3 scripts/check_version_sync.py
        language: system
        pass_filenames: false
        always_run: true
