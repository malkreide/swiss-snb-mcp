[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-snb-mcp"
version = "0.4.2"
description = "MCP server for Swiss National Bank (SNB) data portal — exchange rates, balance sheet, and monetary statistics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
"mcp-name" = "io.github.malkreide/swiss-snb-mcp"
Homepage = "https://github.com/malkreide/swiss-snb-mcp"
Repository = "https://github.com/malkreide/swiss-snb-mcp"
Changelog = "https://github.com/malkreide/swiss-snb-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
swiss-snb-mcp = "swiss_snb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_snb_mcp"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits data.snb.ch — slow, brittle, runs only with `pytest -m live`",
]
