name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly live tests at 03:17 UTC to catch SNB-API schema drift.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Default fuer alle Jobs: nur lesen. `issues: write` braucht allein der
# `live`-Job und steht deshalb dort, nicht hier — auf Workflow-Ebene haette es
# auch der GITHUB_TOKEN jedes PR-Laufs bekommen, also `test` und `lint`, die
# kein Issue anfassen.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      - name: Syntax-Prüfung
        run: python -m py_compile src/swiss_snb_mcp/server.py src/swiss_snb_mcp/warehouse.py

      - name: Import-Test
        run: python -c "from swiss_snb_mcp.server import mcp; print('Import OK')"
        env:
          PYTHONPATH: src

      - name: Unit-Tests (respx-mocked)
        run: pytest -m "not live" -v
        env:
          PYTHONPATH: src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ruff kommt aus dem dev-Extra. Dieser Job hatte vorher nur den
      # separaten Pin-Schritt als ruff-Quelle; mit dessen Wegfall stand er
      # ohne Werkzeug da (`ruff: command not found`).
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - run: ruff check src/ tests/ scripts/

      - run: ruff format --check src/ tests/ scripts/

      # `check_version_sync.py` wird zwischen den Portfolio-Repos kopiert, und
      # dort steht line-length auf 88, 100, 110 oder 120. Der Schritt oben
      # prüft nur die Breite dieses Repos — hier der Default 88, der schmalste
      # Wert im Portfolio. Eine zu lange Zeile fängt er damit bereits ab, und
      # zwar als einziges Repo: die Datei bricht hier, bevor sie irgendwo
      # sonst auffällt.
      #
      # Nicht gefangen wird die Gegenrichtung. `ruff format` zieht einen
      # Ausdruck zusammen, sobald er passt — eine für 88 umgebrochene Zeile
      # besteht hier und würde in jedem 100er-Repo zusammengezogen. Deshalb
      # die Schleife über alle im Portfolio genutzten Breiten statt nur der
      # eigenen.
      #
      # Bewusst einzelne Dateien und nicht `scripts/`: geprüft wird nur, was
      # tatsächlich zwischen Repos wandert. `check_ruff_pin.py` steht seit
      # mcp-audit-skill#70 auch dort und ist seit #29 bzw.
      # mcp-audit-skill#73 in beiden Fassungen breitenunabhängig — es gehört
      # also in die Liste. Kommt ein weiteres geteiltes Skript dazu, ebenso.
      - name: Format-Stabilität der Portfolio-Skripte
        run: |
          for f in scripts/check_version_sync.py scripts/check_ruff_pin.py; do
            for ll in 88 100 110 120; do
              if ! ruff format --check --line-length "$ll" "$f"; then
                echo "::error file=$f::Nicht formatgerecht bei line-length $ll. Die Datei wird portfolioweit kopiert und muss bei jeder genutzten Breite gleich formatiert sein — Begründung im Modul-Docstring."
                exit 1
              fi
            done
          done

      # server.json stand hier auf 0.4.3, während pyproject.toml bei 0.4.4 war,
      # und niemandem fiel es auf: publish.yml schreibt das Feld beim
      # Veröffentlichen aus dem Tag, die committete Zahl wirkt also nie auf das
      # Artefakt und wird von nichts widerlegt. Im lint-Job und nicht in der
      # Test-Matrix, weil der Check nur die Standardbibliothek braucht.
      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

      # Der Ruff-Pin steht zweimal: hier und als `rev` in
      # .pre-commit-config.yaml. Laufen sie auseinander, formatiert der Hook
      # nach der einen und dieser Job prüft nach der anderen Version — der
      # Hook meldet grün und die CI wird rot. Ein Kommentar an beiden Stellen
      # bittet darum, sie zusammen zu bumpen; das hier prüft es.
      - name: Ruff-Pin-Sync (pyproject.toml ↔ .pre-commit-config.yaml)
        run: python scripts/check_ruff_pin.py

  live:
    # Only on the nightly schedule or manual dispatch — never on PR/push so the
    # mainline build is not held hostage to data.snb.ch availability or quota.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Der einzige Job, der schreibt: Er legt bei einem roten Lauf ein Issue an
    # oder schliesst es wieder. Ohne `issues: write` scheitert genau der
    # Schritt, der den Lauf ueberhaupt sichtbar macht.
    #
    # `contents: read` steht hier nochmal, obwohl es oben schon steht: Ein
    # `permissions`-Block am Job ERSETZT den auf Workflow-Ebene, er ergaenzt
    # ihn nicht. Wer die Zeile fuer redundant haelt und streicht, nimmt dem
    # Job das Lesen — und `actions/checkout` faellt als Erstes um.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      # `continue-on-error` an beiden Schritten, damit die Einordnung unten in
      # jedem Fall laeuft. Rot wird der Job am Ende, aus dem eingeordneten
      # Ergebnis — nicht aus dem ersten Schritt, der stolpert.
      - name: Live-Tests gegen SNB API
        id: scenarios
        continue-on-error: true
        env:
          PYTHONPATH: src
        timeout-minutes: 5
        run: |
          set +e
          python tests/test_live_scenarios.py 2>&1 | tee scenarios.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Live-Tests Warehouse API
        id: warehouse
        continue-on-error: true
        env:
          PYTHONPATH: src
        timeout-minutes: 5
        run: |
          set +e
          python tests/test_live_warehouse.py 2>&1 | tee warehouse.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Der Job faehrt seit jeher jede Nacht. Was fehlte, war das hier: Ein
      # rotes Ergebnis sah niemand. Ein geplanter Lauf, dessen Ausgang nur als
      # roter Eintrag im Actions-Tab landet, ist eine teurere Variante von
      # «laeuft nicht» — rote Cron-Jobs werden nach der zweiten Woche nicht
      # mehr angeschaut.
      #
      # Die Einordnung steht in einem Skript mit eigenem Test und nicht hier:
      # Sie entscheidet, ob ein Issue auf- oder zugeht, und das ist der einzige
      # Teil dieses Jobs, der etwas behauptet. In YAML kann das niemand testen.
      - name: Ergebnis einordnen
        id: verdict
        run: |
          python scripts/classify_live_scenarios.py \
            "scenarios.log:${{ steps.scenarios.outputs.exit }}" \
            "warehouse.log:${{ steps.warehouse.outputs.exit }}"
          {
            echo "tail<<LIVE_TAIL"
            tail -n 25 scenarios.log 2>/dev/null || true
            echo "---"
            tail -n 25 warehouse.log 2>/dev/null || true
            echo "LIVE_TAIL"
          } >> "$GITHUB_OUTPUT"

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v9
        # Ueber `env`, nicht ueber `${{ }}` im Skript: Die Szenarien-Ausgabe ist
        # fremder Text, der sonst in einem JavaScript-Template-Literal landet.
        # Ein Backtick oder ein `${` darin bricht das Skript.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
          # Die FAIL-Gruende der gefallenen Szenarien. `tail` zeigt nur den
          # Punktestand — bei einem Timeout sieht der aus wie bei einem
          # Vertragsbruch. Extrahiert wird in classify_live_scenarios.py, wo
          # es getestet ist, nicht hier in YAML.
          LIVE_DETAILS: ${{ steps.verdict.outputs.details }}
        with:
          script: |
            const state = process.env.LIVE_STATE;
            const reason = process.env.LIVE_REASON || '';
            const tail = process.env.LIVE_TAIL || '(keine Ausgabe)';
            const details = (process.env.LIVE_DETAILS || '').trim();
            // Stabiles Praefix: Damit eine zweite rote Nacht den bestehenden
            // Thread verlaengert statt einen zweiten aufzumachen. Bei einem
            // TAEGLICHEN Cron ist das keine Feinheit, sondern der Unterschied
            // zwischen einem Thread und dreissig Issues im Monat.
            const PREFIX = 'Live-Tests gegen data.snb.ch rot';
            const LABEL = 'upstream';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            // `issues.listForRepo` statt der Such-API: Die Suche hat ein
            // eigenes, knappes Rate-Limit und indexiert verzoegert — ein frisch
            // geoeffnetes Issue findet sie unter Umstaenden nicht, und dann
            // legt die naechste rote Nacht ein zweites an.
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown') {
              // Weder oeffnen noch schliessen. Der Lauf hat nichts ueber den
              // Vertrag mit der SNB festgestellt, und ein Issue, das auf so
              // einen Lauf hin zugeht, behauptet einen Vergleich, den es nicht
              // gab.
              core.warning(`Live-Lauf nicht ausgewertet: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'finding') {
              const body = [
                'Der naechtliche Live-Lauf gegen `data.snb.ch` ist rot.',
                '',
                `Lauf: ${run}`,
                `Einordnung: ${reason}`,
                '',
                ...(details
                  ? ['**Warum sie gefallen sind**', '', '```', details, '```', '']
                  : []),
                '**Rot heisst hier nicht zwingend «unser Fehler».** Es heisst: Der Vertrag',
                'mit der Quelle hat sich geaendert, oder die Quelle ist gerade aus. Beides',
                'gehoert gesehen, nur das Erste gehoert gefixt — und genau das Erste sehen',
                'die Unit-Tests nicht, weil ihre Fixtures aus derselben Annahme geschrieben',
                'sind wie der Code.',
                '',
                '<details><summary>Letzte Zeilen beider Szenarienlaeufe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Wieder rot am ${heute}.\n\n${body}`,
                });
              } else {
                // Das Label anlegen, falls das Repo es noch nicht kennt: Sonst
                // scheitert `issues.create` in genau der Nacht, in der das
                // Issue gebraucht wird.
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear — und nur hier wird zugemacht, weil nur hier wirklich
            // verglichen und nichts gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Der Live-Lauf ist wieder gruen (${reason}). Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        # Ueber `env`, nicht ueber `${{ }}`: Der Grund enthaelt Dateinamen und
        # Text aus dem Szenarien-Log, und `${{ }}` setzt ihn vor dem Start
        # woertlich in die Shell ein — ein `$(...)` oder ein Anfuehrungszeichen
        # darin liefe mit. Der github-script-Schritt macht es schon so.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Lauf: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
