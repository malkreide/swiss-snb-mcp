name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly live tests at 03:17 UTC to catch SNB-API schema drift.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      - name: Syntax-Prüfung
        run: python -m py_compile src/swiss_snb_mcp/server.py src/swiss_snb_mcp/warehouse.py

      - name: Import-Test
        run: python -c "from swiss_snb_mcp.server import mcp; print('Import OK')"
        env:
          PYTHONPATH: src

      - name: Unit-Tests (respx-mocked)
        run: pytest -m "not live" -v
        env:
          PYTHONPATH: src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pin ruff so an upstream release cannot change the default rule set or
      # formatter and break CI on unrelated, untouched code. Bump deliberately.
      - run: pip install ruff==0.15.8

      - run: ruff check src/ tests/ scripts/

      - run: ruff format --check src/ tests/ scripts/

      # server.json stand hier auf 0.4.3, während pyproject.toml bei 0.4.4 war,
      # und niemandem fiel es auf: publish.yml schreibt das Feld beim
      # Veröffentlichen aus dem Tag, die committete Zahl wirkt also nie auf das
      # Artefakt und wird von nichts widerlegt. Im lint-Job und nicht in der
      # Test-Matrix, weil der Check nur die Standardbibliothek braucht.
      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

      # Der Ruff-Pin steht zweimal: hier und als `rev` in
      # .pre-commit-config.yaml. Laufen sie auseinander, formatiert der Hook
      # nach der einen und dieser Job prüft nach der anderen Version — der
      # Hook meldet grün und die CI wird rot. Ein Kommentar an beiden Stellen
      # bittet darum, sie zusammen zu bumpen; das hier prüft es.
      - name: Ruff-Pin-Sync (ci.yml ↔ .pre-commit-config.yaml)
        run: python scripts/check_ruff_pin.py

  live:
    # Only on the nightly schedule or manual dispatch — never on PR/push so the
    # mainline build is not held hostage to data.snb.ch availability or quota.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Live-Tests gegen SNB API
        run: python tests/test_live_scenarios.py
        env:
          PYTHONPATH: src
        timeout-minutes: 5

      - name: Live-Tests Warehouse API
        run: python tests/test_live_warehouse.py
        env:
          PYTHONPATH: src
        timeout-minutes: 5
