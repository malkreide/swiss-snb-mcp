name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # Ausgelöst bei jedem Tag wie v0.2.0, v1.0.0 etc.
  workflow_dispatch:  # Erlaubt manuelles Auslösen (z.B. wenn kein Tag gepusht
                      # werden kann). Veröffentlicht die Version aus pyproject.toml
                      # des ausgewählten Branches. skip-existing schützt vor
                      # Doppel-Uploads.

# Default fuer alle Jobs: nur lesen. Der Block fehlte hier ganz — beide Jobs
# unten setzen zwar eigene Rechte, aber ein spaeter ergaenzter Job ohne eigenen
# Block haette den Repo-Default geerbt, und der ist je nach Einstellung
# `write-all`. Ein Publish-Workflow ist der schlechteste Ort fuer diese
# Ueberraschung: Er laeuft auf Tags, also genau dann, wenn niemand zusieht.
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/swiss-snb-mcp

    # `contents: read` steht hier trotz des Defaults oben: Ein
    # `permissions`-Block am Job ERSETZT den auf Workflow-Ebene, er ergaenzt
    # ihn nicht. Ohne die Zeile stuende `contents` auf `none`.
    #
    # Das ging bisher nur gut, weil das Repo oeffentlich ist und
    # `actions/checkout` es dann auch ohne Leserecht klont. Bei einer
    # Umstellung auf privat waere der erste Schritt jedes Releases gebrochen.
    permissions:
      contents: read
      id-token: write   # Pflicht für Trusted Publisher (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Kein 'with: password:' nötig — Trusted Publisher übernimmt das
        with:
          # Bricht nicht ab, wenn eine Version bereits auf PyPI existiert
          # (PyPI ist immutable; ein Re-Upload derselben Version schlägt sonst
          # mit "400 File already exists" fehl).
          skip-existing: true

  publish-mcp:
    name: Publish to MCP Registry
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Sync server.json version to the release version
        run: |
          # On a tag run (v1.2.3) derive the version from the tag. On a manual
          # workflow_dispatch from a branch, GITHUB_REF_NAME is the branch name
          # (e.g. "main"), so stripping "v" would write the branch name into
          # server.json and desync the MCP-registry version from the PyPI
          # artifact. Fall back to the version already committed in server.json.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r '.version' server.json)"
          fi
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
